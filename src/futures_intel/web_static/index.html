<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>期货资讯运行台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>期货资讯运行台</h1>
      <p>本地采集、SQLite、日报与 OpenClaw 交付状态</p>
    </div>
    <div class="actions">
      <input id="date" type="date">
      <button id="refresh" class="secondary">刷新</button>
      <button id="run">采集并生成日报</button>
    </div>
  </header>
  <main>
    <section id="status" class="metrics"></section>
    <section class="panel">
      <div class="panel-title"><h2>品种快照</h2><span id="run-status" class="pill"></span></div>
      <div id="products" class="product-grid"></div>
    </section>
    <section class="panel">
      <h2>数据源健康</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>来源</th><th>状态</th><th>数量</th><th>信息</th><th>完成时间</th></tr></thead>
          <tbody id="health"></tbody>
        </table>
      </div>
    </section>
    <section class="panel">
      <div class="panel-title"><h2>异常与口径提示</h2><span id="anomaly-count" class="pill"></span></div>
      <ul id="anomalies" class="anomalies"></ul>
    </section>
    <section class="panel">
      <div class="panel-title"><h2>OpenClaw 简报</h2><span id="report-path" class="path"></span></div>
      <pre id="brief">正在读取...</pre>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
